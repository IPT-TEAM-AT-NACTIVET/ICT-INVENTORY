<div class="layout">
  <aside class="sidebar" [class.open]="open()">
    <div class="brand">
      <span class="brand-mark">
        <img src="/logo-nactvet.png" alt="NACTVET Logo" />
      </span>
      <span class="brand-name">ICT Inventory</span>
    </div>
    <nav class="nav">
      @for (item of navItems; track item.path) {
        <a
          class="nav-link"
          [routerLink]="item.path"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
          (click)="open.set(false)"
        >
          {{ t(item.labelKey) }}
        </a>
      }
    </nav>
  </aside>
  @if (open()) {
    <div class="sidebar-backdrop" (click)="open.set(false)"></div>
  }
  <div class="main">
    <header class="topbar">
      <div class="topbar-left">
        <button type="button" class="icon-toggle hamburger" (click)="toggleSidebar()" aria-label="Menu">
          <span></span><span></span><span></span>
        </button>
        <span class="role-badge tone-success">{{ t('roles.ictOfficer') }}</span>
      </div>
      <div class="topbar-controls">
        <app-language-switcher />
        <app-theme-toggle />
        <div class="topbar-user">
          <button type="button" class="btn btn-ghost btn-sm user-menu-trigger" (click)="menuOpen.set(!menuOpen())">
            <span class="topbar-name">{{ auth.user()?.fullName }}</span>
            <span class="caret">&#9662;</span>
          </button>
          @if (menuOpen()) {
            <div class="user-menu">
              <button type="button" class="user-menu-item" (click)="goToProfile()">{{ t('nav.profile') }}</button>
              <button type="button" class="user-menu-item" (click)="logout()">{{ t('common.logout') }}</button>
            </div>
          }
        </div>
      </div>
    </header>
    <main class="content">
      <router-outlet />
    </main>
  </div>
</div>
