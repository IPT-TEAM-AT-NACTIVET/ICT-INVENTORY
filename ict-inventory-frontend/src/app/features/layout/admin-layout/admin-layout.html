<div class="layout">
  <aside class="sidebar" [class.open]="open()">
    <div class="brand">
      <span class="brand-mark">
        <img src="/logo-nactvet.png" alt="NACTVET Logo" />
      </span>
      <span class="brand-name">Inventory System</span>
    </div>
    <nav class="nav">
      @for (item of navItems; track item.path) {
        <a
          class="nav-link"
          [routerLink]="item.path"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
          (click)="open.set(false)"
        >
          {{ t(item.labelKey) }}
        </a>
      }
    </nav>
  </aside>
  @if (open()) {
    <div class="sidebar-backdrop" (click)="open.set(false)"></div>
  }
  <div class="main">
    <header class="topbar">
      <div class="topbar-left">
        <button type="button" class="icon-toggle hamburger" (click)="toggleSidebar()" aria-label="Menu">
          <span></span><span></span><span></span>
        </button>
        <span class="role-badge tone-success">{{ t('roles.admin') }}</span>
      </div>
      <div class="topbar-controls">
        <app-language-switcher />
        <app-theme-toggle />
        <div class="topbar-user">
          <span class="topbar-name">{{ auth.user()?.fullName }}</span>
          <button type="button" class="btn btn-ghost btn-sm" (click)="logout()">{{ t('common.logout') }}</button>
        </div>
      </div>
    </header>
    <main class="content">
      <router-outlet />
    </main>
  </div>
</div>
