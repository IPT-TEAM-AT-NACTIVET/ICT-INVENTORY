<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title> NACTVET ICT INVENTORY</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="logo-nactvet.png">
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('ict-theme');
        var theme = stored === 'dark' || stored === 'light'
          ? stored
          : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
