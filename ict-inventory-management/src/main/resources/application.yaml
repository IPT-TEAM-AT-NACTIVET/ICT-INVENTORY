spring:
  application:
    name: ict-inventory-management

  datasource:
    url: jdbc:postgresql://localhost:5439/ict_inventory
    username: postgres
    password: Inventory123
    driver-class-name: org.postgresql.Driver

  sql:
    init:
      mode: always
      separator: "@@"

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  security:
    filter:
      enabled: true

server:
  port: 8088
  servlet:
    context-path: /api
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

logging:
  level:
    org.springframework.security: DEBUG

app:
  jwt:
    secret: ${JWT_SECRET:nactvet-ict-inventory-management-system-secret-key-change-in-production}
    expiration-ms: ${JWT_EXPIRATION:86400000}

  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:4200}

  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:admin123}
    email: ${ADMIN_EMAIL:admin@nactvet.go.tz}
    employee-id: ${ADMIN_EMPLOYEE_ID:EMP001}
    full-name: ${ADMIN_FULL_NAME:System Administrator}
